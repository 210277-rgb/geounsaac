<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GEOUNSAAC · Centro de Mando</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f6f4f0;
  --bg-soft:#ffffff;
  --card:#ffffff;
  --card-hover:#f2efe9;
  --line:#e4ddd0;
  --text:#2a2420;
  --text-dim:#6b6156;
  --text-faint:#8d8171;

  --sidebar-bg:#7a2331;
  --sidebar-bg-soft:#5c1a25;
  --sidebar-hover:#8f2c3c;
  --sidebar-text:#f8ecec;
  --sidebar-text-dim:#d9b3b9;
  --sidebar-line:#93313f;

  --teal:#4c7a3a;
  --teal-soft:rgba(76,122,58,.13);
  --maroon:#7a2331;
  --maroon-soft:rgba(122,35,49,.12);

  --u-logistica:#1b3a6b;
  --u-finanzas:#e6c229;
  --u-investigacion:#2fa84f;
  --u-rrhh:#f28c28;
  --u-relext:#d62828;
  --u-marketing:#7b2fbf;
  --s-pendiente:#9a927f;
  --s-proceso:#3f78c9;
  --s-completado:#3f9a5c;
  --s-retrasado:#c94b4b;
  --a-p:#3f9a5c;
  --a-f:#c94b4b;
  --a-j:#c98a2b;
  --radius:14px;
  --font-display:'Fjalla One','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1400px 900px at 90% -15%, #eef3ea 0%, var(--bg) 45%), var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  -webkit-font-smoothing:antialiased;
}
@font-face{font-family:'Fjalla One';src:local('Arial Narrow Bold');}

#sidebar{
  width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-soft));border-right:1px solid var(--sidebar-line);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px 10px;}
.brand .mark{width:38px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:#fff;font-weight:700;overflow:hidden;flex-shrink:0;}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand .name{font-family:var(--font-display);letter-spacing:.5px;font-size:15px;line-height:1.1;color:var(--sidebar-text);}
.brand .sub{font-size:10px;color:var(--sidebar-text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--sidebar-text-dim);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;user-select:none;}
.navbtn .ic{font-size:15px;width:18px;text-align:center;}
.navbtn:hover{background:var(--sidebar-hover);color:var(--sidebar-text);}
.navbtn.active{background:rgba(143,174,118,.18);color:#bfe0a6;border-color:rgba(143,174,118,.4);}
.nav-foot{margin-top:auto;padding:10px;font-size:10.5px;color:var(--sidebar-text-dim);line-height:1.5;}

#main{flex:1;min-width:0;padding:28px 34px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
.pagetitle{font-family:var(--font-display);font-size:28px;letter-spacing:.3px;}
.pagesub{color:var(--text-dim);font-size:13px;margin-top:4px;max-width:600px;}
.btn{background:var(--teal);color:#fff;border:none;font-weight:700;padding:10px 16px;border-radius:9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:var(--font-body);}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
.btn.ghost:hover{color:var(--text);border-color:var(--teal);}
.btn.danger{background:transparent;color:var(--s-retrasado);border:1px solid rgba(201,75,75,.4);padding:6px 10px;font-size:12px;}

.btn.small{padding:6px 10px;font-size:12px;}
.btn.tiny{padding:4px 8px;font-size:11px;border-radius:6px;}

.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:2fr 1fr;}
.g2{grid-template-columns:1fr 1fr;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr;}.g2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.card h3{margin:0 0 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--text-dim);font-weight:700;}
.kpi-num{font-family:var(--font-display);font-size:34px;line-height:1;}
.kpi-label{font-size:12px;color:var(--text-dim);margin-top:6px;}

.ring-wrap{display:flex;align-items:center;gap:18px;}
.ring{width:96px;height:96px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;}
.ring .hole{position:absolute;inset:11px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.ring .hole b{font-family:var(--font-display);font-size:19px;}
.ring .hole span{font-size:9px;color:var(--text-faint);}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-top:6px;}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

.person-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.person-row:last-child{border-bottom:none;}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.person-name{font-size:13px;font-weight:600;}
.person-role{font-size:11px;color:var(--text-faint);}

.wbar-row{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px;}
.wbar-track{background:var(--bg);border-radius:20px;height:14px;overflow:hidden;border:1px solid var(--line);}
.wbar-fill{height:100%;border-radius:20px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.1px;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:0 1px 3px rgba(20,15,10,.04);}
.jd-section-title{font-family:var(--font-display);font-size:15px;margin:22px 0 12px;letter-spacing:.4px;color:var(--teal);border-bottom:1px solid var(--line);padding-bottom:8px;}
.jd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
.jd-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;}
.jd-card .ph{width:78px;height:78px;border-radius:50%;margin:0 auto 10px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;border:2px solid var(--line);}
.jd-card .ph img{width:100%;height:100%;object-fit:cover;}
.jd-card b{display:block;font-size:12.5px;margin-top:2px;}
.jd-card span{display:block;font-size:11px;color:var(--teal);margin-top:2px;}
.jd-empty{grid-column:1/-1;text-align:center;color:var(--text-faint);font-size:12px;padding:16px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;}
th{text-align:left;padding:13px 16px;color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card-hover);}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:rgba(0,0,0,.012);}
tbody tr:hover{background:var(--card-hover);}
td:first-child,th:first-child{color:var(--text-faint);font-variant-numeric:tabular-nums;font-weight:600;}
.muted{color:var(--text-faint);}
.namecell{font-weight:600;}

.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.form-grid{grid-template-columns:1fr 1fr;}}
label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:5px;font-weight:600;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:8px;font-size:13px;font-family:var(--font-body);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
textarea{resize:vertical;min-height:38px;}
.field.span2{grid-column:span 2;}
.field.span3{grid-column:span 3;}

.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:11px;width:fit-content;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--teal);color:#ffffff;}
.tab.unit-tab.active{color:#ffffff;}

.gantt-scroll{overflow-x:auto;}
.gantt-grid{display:grid;min-width:900px;position:relative;}
.gantt-label{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line);position:sticky;left:0;background:var(--card);z-index:2;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);}
.gantt-label b{font-size:12.5px;}
.gantt-label span{font-size:10.5px;color:var(--text-faint);}
.gantt-label.gl-hdr{background:var(--teal-soft);}
.gantt-label.gl-hdr b{color:var(--teal);letter-spacing:.2px;}
.gantt-label.gl-task{padding-left:28px;position:sticky;}
.gantt-label.gl-task::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:1px;background:var(--line);}
.gantt-label.gl-task b{font-weight:600;font-size:11.5px;color:var(--text-dim);}
.gantt-cell{border-bottom:1px solid var(--line);border-right:1px solid rgba(255,255,255,.03);position:relative;min-height:44px;}
.gantt-cell.weekend{background:rgba(255,255,255,.015);}
.gantt-head-cell{padding:8px 4px;text-align:center;font-size:10px;color:var(--text-faint);border-bottom:1px solid var(--line);border-right:1px solid rgba(255,255,255,.03);position:sticky;top:0;background:var(--card);z-index:1;}
.gantt-head-label{position:sticky;left:0;top:0;background:var(--card);z-index:3;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.gbar{position:absolute;border-radius:7px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#ffffff;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.gbar.retrasado{outline:2px solid var(--s-retrasado);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,77,95,.5)}50%{box-shadow:0 0 0 5px rgba(239,77,95,0)}}

.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:10px;text-transform:uppercase;color:var(--text-faint);text-align:center;padding-bottom:4px;letter-spacing:1px;}
.cal-day{background:var(--bg);border:1px solid var(--line);border-radius:9px;min-height:82px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;position:relative;}
.cal-day.out{opacity:.3;}
.cal-day.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}
.cal-day.meetingday{background:linear-gradient(180deg, rgba(76,122,58,.10), transparent 40%);}
.cal-daynum{font-size:11.5px;font-weight:700;color:var(--text-dim);}
.cal-chip{font-size:9.5px;padding:2px 5px;border-radius:5px;color:#ffffff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-more{font-size:9px;color:var(--text-faint);}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.week-day{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:220px;}
.week-day.meetingday{border-color:var(--teal);}
.week-day h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.6px;}
.week-day h4 b{color:var(--text);font-size:15px;font-family:var(--font-display);display:block;font-weight:400;}
.week-task{font-size:11px;padding:6px 8px;border-radius:7px;margin-bottom:6px;color:#ffffff;font-weight:700;}
.week-task small{display:block;font-weight:500;opacity:.85;font-size:10px;}

.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.year-grid{grid-template-columns:repeat(2,1fr);}}
.mini-month{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;transition:.15s;}
.mini-month:hover{border-color:var(--teal);}
.mini-month h5{margin:0 0 8px;font-size:12px;font-family:var(--font-display);letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;}
.mini-month h5 span{font-family:var(--font-body);font-size:10px;color:var(--teal);font-weight:700;}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-cell{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.04);}
.mini-cell.has{background:var(--teal);}
.mini-cell.out{background:transparent;}

.attend-select{padding:5px 4px;font-size:11px;font-weight:800;text-align:center;border-radius:6px;width:52px;}
/* Tabla de asistencia: la columna de miembro queda fija (una sola fila de alto,
   sin que el nombre se parta en 2-3 líneas) y solo el bloque de columnas de
   fechas se desplaza con su propia barra horizontal. */
.att-scroll{overflow-x:auto;}
.att-table{width:auto;min-width:0;}
.att-table .att-fixed-col{position:sticky;left:0;background:var(--card);white-space:nowrap;min-width:170px;max-width:240px;overflow:hidden;text-overflow:ellipsis;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.04);}
.att-table thead .att-fixed-col{z-index:3;background:var(--card-hover);}
.att-table .att-col{min-width:120px;}
.att-table tbody tr:nth-child(even) .att-fixed-col{background:var(--card-hover);}

.task-row{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);}
@media(max-width:900px){.task-row{grid-template-columns:1fr 1fr;}}
.task-row label{margin-bottom:3px;}

.empty{padding:50px 20px;text-align:center;color:var(--text-faint);}
.empty .ic{font-size:30px;margin-bottom:10px;}
.empty b{color:var(--text-dim);display:block;margin-bottom:4px;font-size:14px;}

.overlay{position:fixed;inset:0;background:rgba(3,8,16,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:760px;}
.modal h2{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}
.modal .modalsub{color:var(--text-faint);font-size:12px;margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.section-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);font-weight:800;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;}

#toast{position:fixed;bottom:22px;right:22px;background:var(--card);border:1px solid var(--teal);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:99;opacity:0;transform:translateY(8px);transition:.25s;}
#toast.show{opacity:1;transform:translateY(0);}

.section{margin-bottom:26px;}
/* Evita que al arrastrar el mouse para seleccionar texto de una sola columna
   (por ejemplo, los correos) se "enganchen" botones, íconos o avatares vecinos. */
.btn,.navbtn,.tab,.badge,.avatar,.jd-card .ph,img,.dot,th{user-select:none;-webkit-user-select:none;}
td{user-select:text;-webkit-user-select:text;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ============================================================
   MODO MÓVIL — sidebar colapsable + ajustes de tacto
============================================================ */
#menu-toggle{display:none;}
@media(max-width:900px){
  body{flex-direction:column;}
  #menu-toggle{
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-soft));
    color:var(--sidebar-text);padding:12px 16px;font-family:var(--font-display);
    font-size:15px;letter-spacing:.4px;border-bottom:1px solid var(--sidebar-line);
    cursor:pointer;user-select:none;
  }
  #menu-toggle .mark{width:28px;height:28px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#fff;}
  #menu-toggle .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  #menu-toggle .hamb{margin-left:auto;font-size:20px;line-height:1;}
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;width:78vw;max-width:280px;
    transform:translateX(-100%);transition:transform .22s ease;z-index:50;
    box-shadow:2px 0 24px rgba(0,0,0,.25);
  }
  #sidebar.open{transform:translateX(0);}
  #sidebar-scrim{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;
  }
  #sidebar-scrim.show{display:block;}
  #main{padding:16px 14px 48px;}
  .pagetitle{font-size:22px;}
  .topbar{flex-direction:column;align-items:stretch;gap:12px;}
  .topbar > div:last-child{justify-content:flex-start;}
  .btn{padding:11px 16px;font-size:14px;}
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr!important;}
  .field.span2,.field.span3{grid-column:span 1;}
  .jd-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .modal{padding:16px;max-height:88vh;overflow-y:auto;border-radius:12px;}
  .modal-actions{flex-wrap:wrap;}
  .modal-actions .btn{flex:1;justify-content:center;}
  table{min-width:640px;}
  input,select,textarea,.btn{font-size:16px;}
  .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;}
  .tab{flex-shrink:0;}
}

</style>
</head>

  if(unidad==="Presidencia") return ["Presidente","Vicepresidente"];
  if(unidad==="Asesores") return ["Asesor"];
  return ["Aspirante","Miembro Activo","Subdirector","Director"];
}
/* Rango de cada cargo: entre más bajo el número, más "peso" tiene el cargo, y su
   insignia se pinta con un tono más intenso (aunque siempre dentro de la misma
   familia de color que su unidad). */
const CARGO_WEIGHT = {"Presidente":0,"Vicepresidente":1,"Director":1,"Asesor":1,"Subdirector":2,"Miembro Activo":3,"Aspirante":4};
const CARGO_ABBR = {"Miembro Activo":"M. Activo"};
function cargoLabel(cargo){ return CARGO_ABBR[cargo] || cargo; }
function hexToRgb(hex){
  const h = hex.replace("#","");
  const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const num = parseInt(n,16);
  return [(num>>16)&255,(num>>8)&255,num&255];
}
function mixWithWhite(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const mix = (c)=> Math.round(c + (255-c)*amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
/* Insignia del cargo: mismo color que la unidad, en un tono pastel cuya intensidad
   depende del rango del cargo (más oscuro/saturado cuanto más alto el cargo). */
function cargoBadgeStyle(unidad, cargo){
  const hex = UNIT_HEX[unidad] || "#8b98ab";
  const w = CARGO_WEIGHT[cargo] ?? 3;
  const bgAmt = 0.78 - w*0.09; // 0.78 (claro) → 0.42 (más saturado) según el rango
  return `color:${hex};background:${mixWithWhite(hex, Math.max(bgAmt,0.4))};border:1px solid ${mixWithWhite(hex,0.55)};`;
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ============================================================
   Persistencia
============================================================ */
let suppressNextSnapshot = false; // evita re-renderizar por el eco de nuestro propio guardado

async function saveState(){
  try{
    suppressNextSnapshot = true;
    await setDoc(stateRef, {
      members: state.members,
      activities: state.activities,
      attendance: state.attendance,
      attendanceState: state.attendanceState,
      attendanceDays: state.attendanceDays,
      grupos: state.grupos,
      settings: state.settings
    });
    return true;
  }catch(e){
    console.error(e);
    suppressNextSnapshot = false;
    toast("⚠ No se pudo guardar en Firebase: " + (e && e.code ? e.code : "revisa tu conexión"));
    return false;
  }
}

function applySnapshotData(d){
  state.members = d.members || [];
  state.activities = d.activities || [];
  state.attendance = d.attendance || {};
  state.attendanceState = d.attendanceState || {};
  state.attendanceDays = d.attendanceDays || [];
  state.grupos = d.grupos || [];
  state.settings = { ...state.settings, ...(d.settings||{}) };
}

/* Carga inicial: espera la primera lectura antes de mostrar la app */
async function loadState(){
  try{
    const snap = await getDoc(stateRef);
    if(snap.exists()) applySnapshotData(snap.data());
  }catch(e){ console.error(e); toast("⚠ No se pudo conectar con Firebase."); }
}

/* Sincronización en tiempo real: si alguien más cambia datos en Firestore,
   esta pestaña se actualiza sola sin necesidad de recargar la página. */
function subscribeState(){
  onSnapshot(stateRef, (snap)=>{
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(!snap.exists()) return;
    applySnapshotData(snap.data());
    render();
  }, (e)=>{ console.error(e); toast("⚠ Se perdió la sincronización en tiempo real."); });
}

/* ============================================================
   Fechas
============================================================ */
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fromISO(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtShort(s){ const d=fromISO(s); if(!d) return "—"; return d.getDate()+" "+MESES[d.getMonth()].slice(0,3); }
function isSameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
function mondayOf(d){ const r=new Date(d); const day=(r.getDay()+6)%7; return addDays(r,-day); }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function activeMembers(){ return state.members.filter(m=>m.estado==="Activo"); }

/* ============================================================
   Tareas planas (derivadas de actividades)
============================================================ */
function allTasks(){
  const out = [];
  state.activities.forEach(act=>{
    (act.tasks||[]).forEach(t=>{
      out.push({ ...t, activityId: act.id, actividad: act.titulo, tipo: act.tipo, fechaActividad: act.fecha });
    });
  });
  return out;
}
function tasksOnDay(dt){
  return allTasks().filter(t=>{
    const s = fromISO(t.fechaInicio), e = fromISO(t.fechaFin);
    if(!s||!e) return false;
    return dt>=s && dt<=e;
  });
}
// Solo actividades reales — la reunión general recurrente no marca el calendario
// para no generar desorden.
function activityOnDay(dt){ return state.activities.find(a=>{ if(!a.fecha) return false; const s=fromISO(a.fecha), e=fromISO(a.fechaFin||a.fecha); return dt>=s && dt<=e; }); }
/* (activityBars() ya no se usa: el Gantt jerárquico arma sus encabezados con buildGanttRows) */

/* ============================================================
   REUNIÓN GENERAL RECURRENTE
   No es una actividad que haya que crear cada semana: se arma sola a partir
   de "Día y hora de reunión" (Panel → Editar). Se repite cada semana en ese
   día; si hay una "fecha especial" (excepción puntual para la próxima vez),
   esa semana usa esa fecha/hora en vez del día por defecto, y luego vuelve
   a lo normal automáticamente. Esta reunión virtual se mezcla con el resto
   de actividades reales al mostrarlas (Panel, Actividades, Gantt, Calendario
   y Asistencia) pero no se guarda como actividad; si alguien crea a mano una
   "Reunión General" real en esa misma fecha, la real manda y la virtual se
   descarta ese día.
============================================================ */
function isSameISOWeek(d1,d2){ return toISO(mondayOf(d1))===toISO(mondayOf(d2)); }
function virtualReunionesGenerales(start,end){
  const dayIdx = DIAS_SEMANA.indexOf(state.settings.reunionDia);
  if(dayIdx<0 || !start || !end) return [];
  const specialDate = state.settings.reunionFechaEspecial ? fromISO(state.settings.reunionFechaEspecial) : null;
  const out = [];
  let cursor = mondayOf(addDays(start,-7));
  const limit = addDays(end,7);
  while(cursor<=limit){
    let occ = addDays(cursor, dayIdx);
    let hora = state.settings.reunionHora;
    if(specialDate && isSameISOWeek(specialDate, occ)){ occ = specialDate; hora = state.settings.reunionHoraEspecial || state.settings.reunionHora; }
    if(occ>=start && occ<=end){
      out.push({ id:"virtual-reunion-"+toISO(occ), virtual:true, titulo:"Reunión General", tipo:"Reunión General", fecha:toISO(occ), fechaFin:toISO(occ), hora, tasks:[] });
    }
    cursor = addDays(cursor,7);
  }
  return out;
}
/* Combina actividades reales con las reuniones generales recurrentes dentro de un
   rango de fechas. Si no se pasa rango, usa una ventana amplia (±180 días). */
function combinedActivities(start,end){
  const s = start || addDays(new Date(),-180);
  const e = end || addDays(new Date(),180);
  const virtuals = virtualReunionesGenerales(s,e);
  const realDatesGeneral = new Set(state.activities.filter(a=>a.tipo==="Reunión General").map(a=>a.fecha));
  return [...state.activities, ...virtuals.filter(v=>!realDatesGeneral.has(v.fecha))];
}

/* Filas jerárquicas del Gantt: cada actividad es un encabezado y, debajo, sus tareas
   ordenadas por fecha de inicio. Devuelve la lista en el mismo orden en que se pintan
   las etiquetas y las barras, para que ambas coincidan fila por fila. */
function buildGanttRows(monthStart, monthEnd){
  const rows = [];
  // Solo actividades reales — la reunión general recurrente no entra al Gantt
  // para no generar desorden.
  const acts = state.activities.filter(a=>{
    const s = fromISO(a.fecha), e = fromISO(a.fechaFin||a.fecha);
    if(!s) return false;
    const actOverlap = s<=monthEnd && e>=monthStart;
    const taskOverlap = (a.tasks||[]).some(t=>{
      const ts = fromISO(t.fechaInicio), te = fromISO(t.fechaFin);
      return ts && te && ts<=monthEnd && te>=monthStart;
    });
    return actOverlap || taskOverlap;
  }).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));

  acts.forEach(a=>{
    rows.push({
      kind:"header", id:"hdr-"+a.id, activityId:a.id, actividad:a.titulo, tipo:a.tipo,
      fechaInicio:a.fecha, fechaFin:a.fechaFin||a.fecha
    });
    (a.tasks||[])
      .filter(t=>{ const ts=fromISO(t.fechaInicio), te=fromISO(t.fechaFin); return ts && te && ts<=monthEnd && te>=monthStart; })
      .sort((x,y)=>(x.fechaInicio||"").localeCompare(y.fechaInicio||""))
      .forEach(t=>{
        rows.push({ kind:"task", id:t.id, activityId:a.id, actividad:a.titulo, unidad:t.unidad, tarea:t.tarea, estado:t.estado, fechaInicio:t.fechaInicio, fechaFin:t.fechaFin });
      });
  });
  return rows;
}

function setView(v){ currentView = v; render(); }

function render(){
  $$(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.view===currentView));
  const foot = $("#nav-foot-meeting");
  if(foot){ const nm = nextMeeting(); foot.textContent = nm ? `Datos compartidos en vivo con todo el círculo. Próxima reunión general: ${fmtShort(nm.fecha)}${nm.hora?" · "+nm.hora:""}.` : "Datos compartidos en vivo con todo el círculo."; }
  const root = $("#app-content");
  if(currentView==="dashboard") root.innerHTML = viewDashboard();
  else if(currentView==="miembros") root.innerHTML = viewMiembros();
  else if(currentView==="junta") root.innerHTML = viewJunta();
  else if(currentView==="unidades") root.innerHTML = viewUnidades();
  else if(currentView==="reuniones") root.innerHTML = viewActividades();
  else if(currentView==="gantt") root.innerHTML = viewGantt();
  else if(currentView==="calendario") root.innerHTML = viewCalendario();
  else if(currentView==="asistencia") root.innerHTML = viewAsistencia();
  attachHandlers();
  if(currentView==="gantt"){ requestAnimationFrame(paintGanttBars); }
}

function parseHoraFinMinutos(rango){
  if(!rango) return null;
  const matches = rango.match(/(\d{1,2}):(\d{2})/g);
  if(!matches || !matches.length) return null;
  const [h,m] = matches[matches.length-1].split(":").map(Number);
  return h*60+m;
}
function nextMeeting(){
  const todayISO = toISO(new Date());
  const upcoming = combinedActivities(new Date(), addDays(new Date(),180))
    .filter(a=>a.tipo==="Reunión General" && a.fecha>=todayISO)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!upcoming.length) return null;
  const a = upcoming[0];
  return { fecha:a.fecha, hora:a.hora||"", titulo:a.titulo||"Reunión General", activity: a.virtual?null:a };
}

}
function sortedMembers(){

/* ============================================================
   ACTIVIDADES (antes "Reuniones") — una actividad, varias tareas por unidad
============================================================ */
/* Última fecha "viva" de una actividad: la de su propio rango, o la fecha de fin
   más lejana entre sus tareas, lo que sea más tarde. Sirve para saber cuándo un
   conjunto de actividades puede pasar a "archivado". */
function actLastDate(a){
  let last = fromISO(a.fechaFin || a.fecha);
  (a.tasks||[]).forEach(t=>{ if(t.fechaFin){ const d = fromISO(t.fechaFin); if(d>last) last = d; } });
  return last;
}

function viewActividades(){
  // Solo actividades reales — la reunión general recurrente no se muestra aquí
  // para no generar desorden; su próxima fecha ya aparece en el Panel.
  const hoyISO = toISO(new Date());
  const hoy = fromISO(hoyISO);
  const near = (a)=> Math.abs(fromISO(a.fecha) - hoy);

  // Arma los "conjuntos de actividades" que sí tienen al menos una actividad,
  // y decide si ya están archivados: al día siguiente de la última fecha (de la
  // actividad o de alguna de sus tareas) registrada dentro del conjunto.
  const gruposConActs = state.grupos.map(g=>{
    const acts = state.activities.filter(a=>a.grupoId===g.id).sort((x,y)=>fromISO(x.fecha)-fromISO(y.fecha));
    if(!acts.length) return null;
    const last = acts.reduce((max,a)=>{ const d = actLastDate(a); return d>max? d : max; }, actLastDate(acts[0]));
    const archivado = last < hoy;
    const nearest = Math.min(...acts.map(near));
    return { ...g, acts, archivado, nearest };
  }).filter(Boolean);

  const gruposActivos = gruposConActs.filter(g=>!g.archivado);
  const gruposArchivados = gruposConActs.filter(g=>g.archivado);
  const sueltas = state.activities.filter(a=>!a.grupoId);

  // Mezcla actividades sueltas + conjuntos activos, ordenados todos por cercanía a hoy.
  const items = [
    ...sueltas.map(a=>({ tipo:"act", data:a, nearest:near(a) })),
    ...gruposActivos.map(g=>({ tipo:"grupo", data:g, nearest:g.nearest })),
  ].sort((x,y)=> x.nearest - y.nearest);

  const cards = items.map(it=> it.tipo==="act" ? renderActCard(it.data,false) : renderGrupoCard(it.data,false)).join("");
  const archivedCards = gruposArchivados.sort((a,b)=>b.nearest-a.nearest).map(g=>renderGrupoCard(g,true)).join("");

  return `
  <div class="topbar">
    <div>
      <div class="pagetitle">Actividades</div>
      <div class="pagesub">Una actividad (reunión, salida de campo, laboratorio, ponencia…) puede repartir varias tareas entre distintas unidades a la vez. La reunión general semanal aparece sola, según lo configurado en el Panel.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
      <button class="btn ghost" data-action="open-grupo-modal">+ Nuevo conjunto</button>
      <button class="btn" data-action="open-activity-modal">+ Registrar actividad</button>
    </div>
  </div>
  ${cards || `<div class="card"><div class="empty"><div class="ic">≡</div><b>Sin actividades todavía</b>Registra la primera para ver aquí toda tu programación.</div></div>`}
  ${gruposArchivados.length ? `
  <div class="jd-section-title" style="margin-top:30px;">Actividades archivadas</div>
  <div class="pagesub" style="margin:-6px 0 14px;">Conjuntos cuya última actividad o tarea ya pasó. Toca "Ver detalle" para revisar todo lo que se registró.</div>
  ${archivedCards}
  ` : ""}
  `;
}

  return {
    id: null,
    fecha: toISO(new Date()),
    fechaFin: toISO(new Date()),
    multiDia: false,
    tipo: "Reunión General",
    tipoOtro: "",
    titulo: "",
    hora: "",
    moderadorId: "",
    redactorId: "",
    showTasks: false,
    tasks: [],
    grupoId: ""
  };
}
function blankTask(){ return { id: uid("tsk"), unidad: UNIDADES_TAREA[0], tarea: "", fechaInicio: toISO(new Date()), fechaFin: toISO(addDays(new Date(),3)), estado:"Pendiente" }; }

function openActivityModal(existing){
  activityDraft = existing ? JSON.parse(JSON.stringify(existing)) : blankDraft();
  if(!activityDraft.tasks) activityDraft.tasks = [];
  if(!activityDraft.grupoId) activityDraft.grupoId = "";
  activityDraft.showTasks = activityDraft.tasks.length>0;
  if(!activityDraft.hora) activityDraft.hora = "";
  if(!activityDraft.fechaFin) activityDraft.fechaFin = activityDraft.fecha;
  activityDraft.multiDia = !!(activityDraft.fechaFin && activityDraft.fechaFin !== activityDraft.fecha);
  renderModalRoot();
}
function closeActivityModal(){ activityDraft = null; renderModalRoot(); }

async function saveActivity(){
  const d = activityDraft;
  if(!d.titulo.trim()){ toast("Ponle un título a la actividad"); return; }
  if(!d.fecha){ toast("Selecciona una fecha"); return; }
  let fechaFin = d.multiDia ? (d.fechaFin || d.fecha) : d.fecha;
  if(fromISO(fechaFin) < fromISO(d.fecha)){ toast("La fecha de fin no puede ser antes que la de inicio"); return; }
  const cleanTasks = d.showTasks ? d.tasks.filter(t=>t.tarea.trim() || t.unidad) : [];
  const payload = { id: d.id||uid("act"), fecha:d.fecha, fechaFin, tipo:d.tipo, tipoOtro:d.tipoOtro, titulo:d.titulo.trim(), hora:(d.hora||"").trim(), moderadorId:d.moderadorId, redactorId:d.redactorId, tasks: cleanTasks, grupoId: d.grupoId||"" };
  if(d.id){
    const idx = state.activities.findIndex(a=>a.id===d.id);
    if(idx>-1) state.activities[idx] = payload;
  } else {
    state.activities.push(payload);
  }
  const btn = $('[data-action="save-activity"]');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = "Guardando…"; }
  const ok = await saveState();
  if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText; }
  if(!ok){
    alert("No se pudo guardar la actividad en Firebase. Verifica que la base de datos Firestore exista y que las reglas de seguridad permitan escribir, o revisa tu conexión.");
    return; // no cierres el modal: el usuario puede reintentar sin perder lo escrito
  }
  closeActivityModal();
  render();
  toast(d.id ? "Actividad actualizada" : "Actividad registrada");
}

function viewGantt(){
  const y = ganttMonthCursor.getFullYear(), mo = ganttMonthCursor.getMonth();
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthStart = new Date(y,mo,1), monthEnd = new Date(y,mo,daysInMonth);
  const rows = buildGanttRows(monthStart, monthEnd);

  let headCells = "";
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,mo,d);
    const wk = dt.getDay()===0||dt.getDay()===6;
    headCells += `<div class="gantt-head-cell" style="${wk?'opacity:.55':''}">${d}<br><span style="font-size:8px;">${DOW[(dt.getDay()+6)%7]}</span></div>`;
  }
  let rowsHtml = "";
  rows.forEach(r=>{
    let cells = "";
    for(let d=1; d<=daysInMonth; d++){
      const dt = new Date(y,mo,d);
      const wk = dt.getDay()===0||dt.getDay()===6;
      cells += `<div class="gantt-cell ${wk?'weekend':''}"></div>`;
    }
    if(r.kind==="header"){
      rowsHtml += `<div class="gantt-label gl-hdr"><b>◆ ${r.actividad}</b><span>${TIPO_ICON[r.tipo]||"✦"} Actividad completa · ${fmtShort(r.fechaInicio)} → ${fmtShort(r.fechaFin)}</span></div>${cells}`;
    }else{
      rowsHtml += `<div class="gantt-label gl-task"><b>${r.tarea||"—"}</b><span>${r.unidad||"—"}</span></div>${cells}`;
    }
  });
  const cols = `210px repeat(${daysInMonth}, minmax(30px,1fr))`;

  return `
  <div class="topbar">
    <div>
      <div class="pagetitle">Cronograma Gantt</div>
      <div class="pagesub">Cada actividad aparece como encabezado y, debajo, sus tareas ordenadas por fecha de inicio.</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn ghost small" data-action="gantt-prev">← Mes anterior</button>
      <span style="font-family:var(--font-display);font-size:15px;min-width:150px;text-align:center;">${MESES[mo]} ${y}</span>
      <button class="btn ghost small" data-action="gantt-next">Mes siguiente →</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;">
    <div class="gantt-scroll">
      <div class="gantt-grid" id="gantt-grid" style="grid-template-columns:${cols};">
        <div class="gantt-head-label" style="padding:10px 12px;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;">Actividad → Tarea</div>
        ${headCells}
        ${rowsHtml || `<div class="gantt-label" style="grid-column:1/-1;border-right:none;"><div class="empty" style="padding:30px 0;"><div class="ic">▤</div><b>No hay actividades este mes</b>Registra actividades para verlas aquí.</div></div>`}
      </div>
    </div>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;">
    ${ESTADOS_TAREA.map(s=>`<div class="legend-row"><span class="dot" style="background:${STATUS_HEX[s]}"></span>${s}</div>`).join("")}
    <div class="legend-row"><span class="dot" style="background:var(--teal)"></span>◆ Actividad (encabezado)</div>
  </div>
  `;
}

function paintGanttBars(){
  const grid = $("#gantt-grid");
  if(!grid) return;
  const y = ganttMonthCursor.getFullYear(), mo = ganttMonthCursor.getMonth();
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthStart = new Date(y,mo,1), monthEnd = new Date(y,mo,daysInMonth);
  const rows = buildGanttRows(monthStart, monthEnd);
  if(!rows.length) return;
  const labelCol = grid.querySelector(".gantt-label");
  if(!labelCol) return;
  const labelWidth = labelCol.getBoundingClientRect().width;
  const gridRect = grid.getBoundingClientRect();
  const dayWidth = (gridRect.width - labelWidth) / daysInMonth;
  const labels = $$(".gantt-label", grid);
  labels.forEach((labelEl, i)=>{
    const r = rows[i]; if(!r) return;
    let s = fromISO(r.fechaInicio), e = fromISO(r.fechaFin);
    if(s<monthStart) s=monthStart; if(e>monthEnd) e=monthEnd;
    const startDay = s.getDate(), span = Math.max(1, e.getDate()-s.getDate()+1);
    const bar = document.createElement("div");
    bar.className = "gbar" + (r.estado==="Retrasada" ? " retrasado" : "");
    bar.style.left = (labelWidth + (startDay-1)*dayWidth) + "px";
    bar.style.width = (span*dayWidth - 4) + "px";
    bar.style.top = (labelEl.offsetTop + 8) + "px";
    bar.style.height = (labelEl.getBoundingClientRect().height - 16) + "px";
    bar.style.background = r.kind==="header" ? "var(--teal)" : (r.estado==="Completada" ? STATUS_HEX["Completada"] : r.estado==="Retrasada" ? STATUS_HEX["Retrasada"] : r.estado==="En Proceso" ? STATUS_HEX["En Proceso"] : (UNIT_HEX[r.unidad]||STATUS_HEX["Pendiente"]));
    bar.textContent = r.kind==="header" ? ("◆ "+r.actividad) : (r.tarea || "");
    bar.title = r.kind==="header" ? `${r.actividad} · actividad completa · ${fmtShort(r.fechaInicio)} → ${fmtShort(r.fechaFin)}` : `${r.actividad} · ${r.unidad} · ${r.estado} · ${fmtShort(r.fechaInicio)} → ${fmtShort(r.fechaFin)}`;
    grid.appendChild(bar);
  });
}

function viewCalendario(){

    <div class="tab ${calSubTab==='anio'?'active':''}" data-action="cal-tab" data-tab="anio">Año</div>
  </div>
  <div id="cal-body">${calSubTab==='semana'?calWeek():calSubTab==='mes'?calMonth():calYear()}</div>
  `;
}
function calNavHeader(label){
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn ghost small" data-action="cal-prev">←</button>
    <span style="font-family:var(--font-display);font-size:18px;min-width:220px;">${label}</span>
    <button class="btn ghost small" data-action="cal-next">→</button>
    <button class="btn ghost small" data-action="cal-today">Hoy</button>
  </div>`;
}
function calWeek(){
  const start = mondayOf(calCursor);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const label = `${days[0].getDate()} ${MESES[days[0].getMonth()].slice(0,3)} – ${days[6].getDate()} ${MESES[days[6].getMonth()].slice(0,3)} ${days[6].getFullYear()}`;
  const today = new Date();
  return calNavHeader(label) + `
  <div class="week-grid">
    ${days.map(d=>{
      const tasks = tasksOnDay(d);
      const act = activityOnDay(d);
      return `<div class="week-day ${act?'meetingday':''}">
        <h4>${DOW[(d.getDay()+6)%7]}${isSameDay(d,today)?' · hoy':''}<b>${d.getDate()}</b></h4>
        ${act?`<div class="week-task" style="background:var(--teal);">${TIPO_ICON[act.tipo]} ${act.titulo}</div>`:""}
        ${tasks.map(t=>`<div class="week-task" style="background:${UNIT_HEX[t.unidad]}">${t.tarea||t.actividad}<small>${t.unidad} · ${t.estado}</small></div>`).join("") || (act?"":`<div class="muted" style="font-size:11px;">Sin actividades</div>`)}
      </div>`;
    }).join("")}
  </div>`;
}
function calMonth(){
  const y = calCursor.getFullYear(), mo = calCursor.getMonth();
  const first = new Date(y,mo,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,mo,d));
  while(cells.length%7!==0) cells.push(null);
  const today = new Date();
  return calNavHeader(`${MESES[mo]} ${y}`) + `
  <div class="cal-month">
    ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
    ${cells.map(d=>{
      if(!d) return `<div class="cal-day out"></div>`;
      const tasks = tasksOnDay(d);
      const act = activityOnDay(d);
      const shown = tasks.slice(0,2);
      const extra = tasks.length-shown.length;
      return `<div class="cal-day ${isSameDay(d,today)?'today':''} ${act?'meetingday':''}">
        <div class="cal-daynum">${d.getDate()}${act?' '+TIPO_ICON[act.tipo]:''}</div>
        ${shown.map(t=>`<div class="cal-chip" style="background:${UNIT_HEX[t.unidad]}" title="${t.tarea||t.actividad}">${t.tarea||t.actividad}</div>`).join("")}
        ${extra>0?`<div class="cal-more">+${extra} más</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}
function calYear(){
  const y = calCursor.getFullYear();
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn ghost small" data-action="cal-prev">←</button>
    <span style="font-family:var(--font-display);font-size:18px;">${y}</span>
    <button class="btn ghost small" data-action="cal-next">→</button>
  </div>
  <div class="year-grid">
    ${MESES.map((mName,mo)=>{
      const first = new Date(y,mo,1);
      const startOffset = (first.getDay()+6)%7;
      const daysInMonth = new Date(y,mo+1,0).getDate();
      const cells = [];
      for(let i=0;i<startOffset;i++) cells.push(null);
      for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,mo,d));
      const count = allTasks().filter(t=>{
        const s = fromISO(t.fechaInicio), e = fromISO(t.fechaFin);
        if(!s||!e) return false;
        return s<=new Date(y,mo+1,0) && e>=new Date(y,mo,1);
      }).length;
      return `<div class="mini-month" data-action="cal-jump-month" data-month="${mo}">
        <h5>${mName}<span>${count?count+" tareas":""}</span></h5>
        <div class="mini-grid">${cells.map(d=>`<div class="mini-cell ${!d?'out':(tasksOnDay(d).length?'has':'')}"></div>`).join("")}</div>
      </div>`;
    }).join("")}
  </div>`;
}

async function saveAttendanceDay(){

  closeAttendanceDayModal();
  render();
  toast("Día de asistencia registrado — pulsa 'Tomar lista' para marcarla");

   desde dentro del modal de Registrar actividad (returnToActivity=true),

============================================================ */
function openGrupoModal(existing, returnToActivity){
  const root = $("#modal-root");
  const g = existing ? { ...existing } : { id:null, nombre:"", moderador1Id:"", moderador2Id:"" };
  const memberOpts = (sel)=> activeMembers().map(m=>`<option value="${m.id}" ${sel===m.id?"selected":""}>${m.nombre}</option>`).join("");
  const volver = ()=>{ if(returnToActivity && activityDraft) renderModalRoot(); else root.innerHTML=""; };
  root.innerHTML = `
  <div class="overlay" id="grupo-overlay">
    <div class="modal" style="max-width:480px;">
      <h2>${g.id ? "Editar conjunto de actividades" : "Nuevo conjunto de actividades"}</h2>
      <div class="modalsub">Agrupa varias actividades bajo un mismo título (ej. "Semana de Ponencias") con dos moderadores fijos. Luego, al registrar cada actividad, la asignas a este conjunto.</div>
      <div class="form-grid" style="grid-template-columns:1fr;">
        <div class="field"><label>Título del conjunto</label><input id="g-nombre" value="${g.nombre||""}" placeholder='Ej: Semana de Ponencias de Ingeniería Geotécnica'></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div class="field"><label>Moderador 1 (opcional)</label><select id="g-mod1"><option value="">— sin asignar —</option>${memberOpts(g.moderador1Id)}</select></div>
        <div class="field"><label>Moderador 2 (opcional)</label><select id="g-mod2"><option value="">— sin asignar —</option>${memberOpts(g.moderador2Id)}</select></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-action="close-grupo-modal">Cancelar</button>
        <button type="button" class="btn" data-action="save-grupo">Guardar</button>
      </div>
    </div>
  </div>`;
  $("#grupo-overlay").querySelector('[data-action="close-grupo-modal"]').onclick = volver;
  $("#grupo-overlay").querySelector('[data-action="save-grupo"]').onclick = async ()=>{
    const nombre = $("#g-nombre").value.trim();
    if(!nombre){ toast("Ponle un título al conjunto"); return; }
    const datos = { nombre, moderador1Id: $("#g-mod1").value, moderador2Id: $("#g-mod2").value };
    if(g.id){
      const idx = state.grupos.findIndex(x=>x.id===g.id);
      if(idx>-1) state.grupos[idx] = { ...state.grupos[idx], ...datos };
    } else {
      g.id = uid("grp");
      state.grupos.push({ id:g.id, ...datos });
      if(returnToActivity && activityDraft) activityDraft.grupoId = g.id; // selecciona el nuevo conjunto de una
    }
    await saveState();
    toast(g.id ? "Conjunto guardado" : "Conjunto creado");
    if(returnToActivity && activityDraft) renderModalRoot(); else { root.innerHTML=""; render(); }
  };
}

/* ============================================================
   HANDLERS
============================================================ */
function attachHandlers(){
  $$(".navbtn").forEach(b=> b.onclick = ()=>{ setView(b.dataset.view); closeMobileMenu(); });

  $$("[data-action]", $("#app-content")).forEach(el=>{
    const action = el.dataset.action;
    if(action==="quick-task-status" && el.tagName==="SELECT"){
      el.onchange = async ()=>{
        const act = state.activities.find(a=>a.id===el.dataset.activity);
        const task = act && act.tasks.find(t=>t.id===el.dataset.task);
        if(task){ task.estado = el.value; await saveState(); render(); toast("Estado actualizado"); }
      };
      return;
    }
    if(action==="attend" && el.tagName==="SELECT"){
      el.onchange = async ()=>{
        const aid = el.dataset.activity, mid = el.dataset.member;
        if(!state.attendance[aid]) state.attendance[aid]={};
        state.attendance[aid][mid] = el.value;
        await saveState();
        const hex = ATT_HEX[el.value] || "#1c3453";
        el.style.background = hex+"22"; el.style.color = hex; el.style.borderColor = hex+"55";
      };
      return;
    }
    if(action==="unit-tab"){ el.onclick = ()=>{ unitTab = el.dataset.unit; render(); }; return; }
    if(action==="sort-members"){
      el.onclick = ()=>{
        const col = el.dataset.col;
        if(memberSort.col===col) memberSort.dir *= -1; else { memberSort.col = col; memberSort.dir = 1; }
        render();
      };
      return;
    }
    if(action==="tomar-lista"){
      el.onclick = async ()=>{
        const clave = prompt("Ingresa la clave de Recursos Humanos para tomar lista:");
        if(clave===null) return;
        if(clave!==RRHH_KEY){ toast("⚠ Clave incorrecta"); return; }
        state.attendanceState[el.dataset.activity] = "abierta";
        await saveState();
        render();
        toast("Lista abierta para tomar asistencia");
      };
      return;
    }
    if(action==="tomar-lista-reunion-general"){
      el.onclick = async ()=>{
        const nm = nextMeeting();
        if(!nm) return;
        const clave = prompt("Ingresa la clave de Recursos Humanos para tomar lista:");
        if(clave===null) return;
        if(clave!==RRHH_KEY){ toast("⚠ Clave incorrecta"); return; }
        let day = state.attendanceDays.find(d=>d.fecha===nm.fecha && d.tipo==="Reunión General");
        if(!day){ day = { id: uid("day"), fecha: nm.fecha, tipo:"Reunión General", tipoOtro:"" }; state.attendanceDays.push(day); }
        state.attendanceState[day.id] = "abierta";
        await saveState();
        render();
        toast("Lista de la reunión general abierta para tomar asistencia");
      };
      return;
    }
    if(action==="cerrar-lista"){
      el.onclick = async ()=>{
        if(!confirm("¿Cerrar esta lista de asistencia? Ya no se podrá volver a abrir.")) return;
        state.attendanceState[el.dataset.activity] = "cerrada";
        await saveState();
        render();
        toast("Lista cerrada");
      };
      return;
    }
    if(action==="del-attendance-col"){
      el.onclick = async ()=>{
        const clave = prompt("Ingresa la clave maestra para eliminar esta columna de asistencia:");
        if(clave===null) return;
        if(clave!==MASTER_KEY){ toast("⚠ Clave maestra incorrecta"); return; }
        const actId = el.dataset.activity;
        const esDiaSuelto = state.attendanceDays.some(d=>d.id===actId);
        const esActividad = state.activities.some(a=>a.id===actId);
        const msg = esActividad
          ? "¿Eliminar esta columna de asistencia? La actividad seguirá existiendo en \"Actividades\"; solo se borrará su columna en Asistencia y los registros de P/F/J de todos los miembros. Esta acción no se puede deshacer."
          : "¿Eliminar esta columna de asistencia? Se borrarán los registros de P/F/J de todos los miembros para este día. Esta acción no se puede deshacer.";
        if(!confirm(msg)) return;
        if(esDiaSuelto) state.attendanceDays = state.attendanceDays.filter(d=>d.id!==actId);
        delete state.attendance[actId];
        delete state.attendanceState[actId];
        await saveState();
        render();
        toast("Columna de asistencia eliminada");
      };
      return;
    }
    if(action==="cal-jump-month"){ el.onclick = ()=>{ calCursor = new Date(calCursor.getFullYear(), Number(el.dataset.month), 1); calSubTab="mes"; render(); }; return; }

    el.onclick = async ()=>{
      if(action==="open-activity-modal"){ openActivityModal(null); }
      else if(action==="open-grupo-modal"){ openGrupoModal(null, false); }
      else if(action==="edit-grupo"){ const g = state.grupos.find(x=>x.id===el.dataset.id); if(g) openGrupoModal(g, false); }
      else if(action==="toggle-archived-grupo"){ const id = el.dataset.id; if(expandedArchivedGroups.has(id)) expandedArchivedGroups.delete(id); else expandedArchivedGroups.add(id); render(); }
      else if(action==="open-attendance-day-modal"){ openAttendanceDayModal(); }
      else if(action==="edit-activity"){ const a = state.activities.find(x=>x.id===el.dataset.id); if(a) openActivityModal(a); }
      else if(action==="del-member"){
        const clave = prompt("Ingresa la clave maestra para eliminar a este miembro:");
        if(clave===null) return;
        if(clave!==MASTER_KEY){ toast("⚠ Clave maestra incorrecta"); return; }
        if(confirm("¿Eliminar este miembro del directorio?")){ state.members = state.members.filter(m=>m.id!==el.dataset.id); await saveState(); render(); toast("Miembro eliminado"); }
      }
      else if(action==="gantt-prev"){ ganttMonthCursor = new Date(ganttMonthCursor.getFullYear(), ganttMonthCursor.getMonth()-1, 1); render(); }
      else if(action==="gantt-next"){ ganttMonthCursor = new Date(ganttMonthCursor.getFullYear(), ganttMonthCursor.getMonth()+1, 1); render(); }
      else if(action==="cal-tab"){ calSubTab = el.dataset.tab; render(); }
      else if(action==="cal-prev"){ calCursor = calSubTab==="semana"? addDays(calCursor,-7) : calSubTab==="anio"? new Date(calCursor.getFullYear()-1,0,1) : new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); render(); }
      else if(action==="cal-next"){ calCursor = calSubTab==="semana"? addDays(calCursor,7) : calSubTab==="anio"? new Date(calCursor.getFullYear()+1,0,1) : new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); render(); }
      else if(action==="cal-today"){ calCursor = new Date(); render(); }
      else if(action==="edit-meeting"){ openMeetingModal(); }
    };
  });

  const mform = $("#member-form");
  if(mform){
    const mfUnidad = $("#mf-unidad", mform);
    const mfCargo = $("#mf-cargo", mform);
    if(mfUnidad && mfCargo){
      mfUnidad.onchange = ()=>{
        mfCargo.innerHTML = cargosDeUnidad(mfUnidad.value).map(c=>`<option>${c}</option>`).join("");
        mfCargo.disabled = mfUnidad.value==="Asesores";
      };
      mfUnidad.onchange();
    }
    mform.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(mform);
      const apellidoPaterno = toTitleCase(fd.get("apellidoPaterno"));
      const apellidoMaterno = toTitleCase(fd.get("apellidoMaterno"));
      const nombres = toTitleCase(fd.get("nombres"));
      const nombreCompleto = `${apellidoPaterno} ${apellidoMaterno}`.trim() + (nombres?`, ${nombres}`:"");
      const unidad = fd.get("unidad");
      const cargo = unidad==="Asesores" ? "Asesor" : fd.get("cargo");
      const fotoFile = fd.get("foto");
      let foto = "";
      if(fotoFile && fotoFile.size>0){
        try{ foto = await fileToResizedDataURL(fotoFile, 160); }
        catch(err){ toast("No se pudo procesar la foto, se guardó sin ella"); }
      }
      const datos = {
        apellidoPaterno, apellidoMaterno, nombres, nombre: nombreCompleto,
        codigo: fd.get("codigo").trim(), dni: (fd.get("dni")||"").trim(), fechaNacimiento: fd.get("fechaNacimiento")||"", unidad, cargo,
        email: fd.get("email").trim(), telefono: fd.get("telefono").trim(), estado: "Activo",
      };
      if(foto) datos.foto = foto;

      // Si alguien vuelve a registrarse con el mismo nombre y apellidos, se asume
      // que es la misma persona actualizando sus datos: se reemplaza el registro
      // existente en vez de crear un duplicado en el directorio.
      const norm = (s)=> (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      const existente = state.members.find(m=>
        norm(m.apellidoPaterno)===norm(apellidoPaterno) &&
        norm(m.apellidoMaterno)===norm(apellidoMaterno) &&
        norm(m.nombres)===norm(nombres)
      );
      if(existente){
        if(!datos.foto) datos.foto = existente.foto || "";
        Object.assign(existente, datos);
        await saveState(); render(); toast("Ya existía — se actualizaron sus datos con lo más reciente");
      }else{
        state.members.push({ id: uid("mem"), foto:"", ...datos });
        await saveState(); render(); toast("Miembro agregado al directorio");
      }
      mform.reset();
    };
  }
}

/* Redimensiona una imagen a un cuadrado pequeño y la devuelve como data URL, para no saturar el almacenamiento */
function fileToResizedDataURL(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   MENÚ MÓVIL — abre/cierra el sidebar con el botón hamburguesa
============================================================ */
function closeMobileMenu(){
  $("#sidebar").classList.remove("open");
  $("#sidebar-scrim").classList.remove("show");
}
function openMobileMenu(){
  $("#sidebar").classList.add("open");
  $("#sidebar-scrim").classList.add("show");
}
(function initMobileMenu(){
  const hamb = document.getElementById("hamb-btn");
  const scrim = document.getElementById("sidebar-scrim");
  if(hamb) hamb.onclick = ()=>{
    const sb = $("#sidebar");
    sb.classList.contains("open") ? closeMobileMenu() : openMobileMenu();
  };
  if(scrim) scrim.onclick = closeMobileMenu;
})();

============================================================ */

  $("#app-content").innerHTML = `<div class="empty" style="padding:120px 0;"><div class="ic">◆</div><b>Cargando GEOUNSAAC…</b></div>`;
  await loadState();
  render();
  subscribeState();
}
init();
